<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#5B3DF5"/><stop offset="1" stop-color="#3920C9"/></linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2" fill="#fff" opacity=".12"/></pattern>
    <filter id="shadow" x="-.2" y="-.2" width="1.5" height="1.5"><feDropShadow dx="0" dy="12" stdDeviation="0" flood-color="#1C1240" flood-opacity=".6"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="630" rx="34" fill="url(#dots)"/>
  <circle cx="1080" cy="80" r="220" fill="#7A62FF" opacity=".34"/>
  <image href="mascot.png" x="42" y="70" width="470" height="490" preserveAspectRatio="xMidYMid meet"/>
  <g filter="url(#shadow)" font-family="Arial, sans-serif" font-weight="900" text-anchor="start" paint-order="stroke">
    <text x="530" y="270" font-size="112" fill="#FFD23F" stroke="#1C1240" stroke-width="24" stroke-linejoin="round">MEME</text>
    <text x="530" y="385" font-size="112" fill="#FFD23F" stroke="#1C1240" stroke-width="24" stroke-linejoin="round">MACHINE</text>
  </g>
  <text x="540" y="470" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#fff">BE FUNNY. BEAT THE MACHINE.</text>
  <rect x="530" y="510" width="540" height="58" rx="28" fill="#2EE6A6" stroke="#1C1240" stroke-width="5"/>
  <text x="800" y="547" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="900" fill="#1C1240">A PARTY GAME FOR 2–8 PLAYERS</text>
</svg>
